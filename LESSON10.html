<!DOCTYPE html>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Doctor Meetup</title>
  </head>
  <body>
    <h1>
        🏥My Doctor's Appointment
    </h1>
    <p>
        Fill in the form below to book your appointment
    </p>
    <hr>

    <form>
       
        <fieldset>
         <legend>Your Details</legend>
         <label>Your good Name</label><br>
         <input type="text" id="name" placeholder="Enter your name here"> <br><br>
         <label>Your Identification</label><br>
         <input type="password" id="ID" placeholder="Your private ID"><br><br>
         <label> Date of Birth </label><br>
         <input type="date" id="DoB"> <br>
        </fieldset>
        <br>


        <fieldset>
            <legend>Visiting Details</legend>

            <label> Your preferred Doctor</label><br>
            <select id="Doctor">
               <option value=""> :- Select a Doctor -:</option>
               <option value="Doc-May">Dr. May - Common health issues</option>
               <option value="Doc-George">Dr. George - Heart issues</option>
               <option value="Doc-Sam"> Dr.Sam - Ears</option>
            </select><br><br>

            <label>Reason for your visit</label><br>
            <input type="radio" name="reason" value="nausea"> Nausea<br>
            <input type="radio" name="reason" value="dizzy"> Dizziness<br>
            <input type="radio" name="reason" value="checkup"> Normal checkup <br>
            <input type="radio" name="reason" value="gums"> Gums pain <br>
            

            <label>Note for the doctor</label>
            <textarea id="opinion" rows="4" cols="36" placeholder="e.g I have pain in my head">

            </textarea>
            <br>
            <fieldset>
                <legend>Possible visiting day</legend>
                <input type="checkbox" value="mond"> Monday <br>
                <input type="checkbox" value="wed"> Wednesday <br>
                <input type="checkbox" value="sat"> Saturday <br>
            </fieldset>
        </fieldset>
        
    </form>
    </body>
    </html>
<html>
